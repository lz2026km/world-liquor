<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>世界烈酒图鉴 · World Liquor Gallery</title>

  <meta name="keywords" content="世界烈酒,白酒,威士忌,白兰地,伏特加,金酒,朗姆酒,龙舌兰,品鉴,调酒">
  <meta property="og:title" content="世界烈酒图鉴">
  <meta property="og:description" content="探索全球200款顶级烈酒">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ================================================
       世界烈酒图鉴 v3.0
       深邃藏蓝 + 鎏金奢华 · 189函数完整架构
       ================================================ */
    :root {
      --midnight-100: #f8f4f0;
      --midnight-200: #e8e0d8;
      --midnight-300: #c9bfb5;
      --midnight-400: #9a8b7a;
      --midnight-500: #6b5d4d;
      --midnight-600: #4a3f32;
      --midnight-700: #2d2520;
      --midnight-800: #1a1512;
      --midnight-900: #0d0a08;
      --midnight-950: #050303;
      --gold-100: #fef7dc;
      --gold-200: #fcefc4;
      --gold-300: #f9e09c;
      --gold-400: #f5cc6a;
      --gold-500: #e8a829;
      --gold-600: #c4891a;
      --gold-700: #9a6b12;
      --gold-800: #734e0d;
      --gold-900: #5a3d0e;
      --copper-400: #da8a5f;
      --copper-500: #c77350;
      --copper-600: #a85d3e;
      --burgundy-500: #8b2942;
      --burgundy-600: #6b1f32;
      --bg-deepest: var(--midnight-950);
      --bg-deep: var(--midnight-900);
      --bg-card: var(--midnight-800);
      --bg-elevated: rgba(45, 37, 32, 0.95);
      --bg-glass: rgba(26, 21, 18, 0.7);
      --text-gold: var(--gold-400);
      --text-gold-muted: var(--gold-600);
      --text-cream: var(--midnight-200);
      --text-muted: var(--midnight-400);
      --text-subtle: var(--midnight-500);
      --border-gold: rgba(232, 168, 41, 0.25);
      --border-gold-bright: rgba(232, 168, 41, 0.5);
      --glow-gold: 0 0 20px rgba(232, 168, 41, 0.3);
      --glow-gold-strong: 0 0 40px rgba(232, 168, 41, 0.4), 0 0 80px rgba(232, 168, 41, 0.2);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-2xl: 32px;
      --radius-full: 9999px;
      --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-accent: "Playfair Display", "Noto Serif SC", serif;
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --transition-fast: 150ms var(--ease-smooth);
      --transition-normal: 300ms var(--ease-smooth);
      --transition-slow: 500ms var(--ease-smooth);
      --z-base: 1;
      --z-card: 10;
      --z-header: 100;
      --z-dropdown: 200;
      --z-modal-backdrop: 300;
      --z-modal: 400;
      --z-toast: 500;
    }
    [data-theme="dark"] { --bg: var(--midnight-950); --text: var(--midnight-200); }
    [data-theme="light"] { --bg: #f5f0e8; --text: #2d2520; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-body); background: var(--bg-deepest); color: var(--text-cream); min-height: 100vh; line-height: 1.6; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(232, 168, 41, 0.05) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 41, 66, 0.03) 0%, transparent 50%), linear-gradient(180deg, var(--bg-deepest) 0%, var(--midnight-900) 50%, var(--bg-deepest) 100%); pointer-events: none; z-index: -1; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold-600), var(--gold-800)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--gold-500), var(--gold-700)); }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    img { display: block; max-width: 100%; }
    /* ===== INITIAL LOADING ===== */
    .initial-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; }
    .initial-loading__icon { font-size: 72px; animation: float 2s ease-in-out infinite; }
    .initial-loading__text { font-family: var(--font-accent); font-size: 1.5rem; color: var(--gold-500); letter-spacing: 0.2em; }
    .initial-loading__bar { width: 200px; height: 3px; background: rgba(232, 168, 41, 0.2); border-radius: 2px; overflow: hidden; }
    .initial-loading__bar::after { content: ''; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, var(--gold-500), var(--gold-400)); border-radius: 2px; animation: loading 1.2s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    /* ===== HEADER ===== */
    .header { position: sticky; top: 0; z-index: var(--z-header); background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-glass) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-gold); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 -1px 0 var(--border-gold); }
    .header__container { max-width: 1440px; margin: 0 auto; padding: var(--space-md) var(--space-xl); display: flex; align-items: center; gap: var(--space-xl); }
    .header__brand { display: flex; align-items: center; gap: var(--space-md); flex-shrink: 0; text-decoration: none; }
    .header__logo { width: 48px; height: 48px; background: linear-gradient(135deg, var(--gold-700), var(--gold-900)); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--glow-gold); }
    .header__titles { display: flex; flex-direction: column; }
    .header__title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--text-cream); letter-spacing: 0.05em; }
    .header__subtitle { font-family: var(--font-accent); font-size: 0.75rem; color: var(--midnight-400); letter-spacing: 0.15em; text-transform: uppercase; }
    .header__search { flex: 1; max-width: 480px; position: relative; }
    .search-bar { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius-full); padding: var(--space-sm) var(--space-md); gap: var(--space-sm); transition: all var(--transition-fast); }
    .search-bar:focus-within { border-color: var(--gold-500); box-shadow: var(--glow-gold); }
    .search-bar__icon { font-size: 16px; opacity: 0.6; }
    .search-bar__input { flex: 1; background: none; border: none; color: var(--text-cream); font-size: 0.95rem; outline: none; }
    .search-bar__input::placeholder { color: var(--midnight-500); }
    .search-bar__clear, .search-bar__submit { background: none; color: var(--midnight-400); font-size: 14px; padding: var(--space-xs); border-radius: 50%; transition: all var(--transition-fast); }
    .search-bar__clear:hover, .search-bar__submit:hover { color: var(--gold-500); }
    .search-bar__submit { background: linear-gradient(135deg, var(--gold-700), var(--gold-900)); color: var(--gold-200); padding: 6px 16px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; }
    .search-bar__submit:hover { box-shadow: var(--glow-gold); }
    .search-autocomplete { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius-lg); margin-top: var(--space-sm); box-shadow: var(--shadow-lg); z-index: var(--z-dropdown); display: none; overflow: hidden; }
    .search-autocomplete.show { display: block; }
    .search-autocomplete__item { padding: var(--space-md); cursor: pointer; display: flex; align-items: center; gap: var(--space-md); border-bottom: 1px solid var(--border-gold); transition: background var(--transition-fast); }
    .search-autocomplete__item:last-child { border-bottom: none; }
    .search-autocomplete__item:hover { background: rgba(232, 168, 41, 0.1); }
    .search-autocomplete__icon { font-size: 20px; }
    .search-autocomplete__info { flex: 1; }
    .search-autocomplete__name { font-weight: 600; color: var(--text-cream); }
    .search-autocomplete__meta { font-size: 0.8rem; color: var(--midnight-400); }
    .search-autocomplete__empty { padding: var(--space-lg); text-align: center; color: var(--midnight-500); }
    .header__actions { display: flex; align-items: center; gap: var(--space-md); }
    .header__btn { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid var(--border-gold); color: var(--midnight-400); font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast); }
    .header__btn:hover { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-500); color: var(--gold-400); }
    .header__btn.active { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-500); color: var(--gold-400); }
    .lang-btn { font-size: 12px; padding: 6px 12px; font-weight: 600; }
    /* ===== LAYOUT ===== */
    .app-layout { display: flex; min-height: calc(100vh - 70px); }
    /* ===== SIDEBAR ===== */
    .sidebar { width: 280px; min-width: 280px; background: var(--bg-glass); backdrop-filter: blur(16px); border-right: 1px solid var(--border-gold); padding: var(--space-lg); overflow-y: auto; max-height: calc(100vh - 70px); position: sticky; top: 70px; display: flex; flex-direction: column; gap: var(--space-lg); }
    .sidebar.collapsed { width: 60px; min-width: 60px; }
    .sidebar__section { }
    .sidebar__title { font-size: 0.75rem; color: var(--gold-600); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; margin-bottom: var(--space-md); padding-left: var(--space-sm); border-left: 2px solid var(--gold-700); }
    .sidebar__tags { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
    .sidebar__tag { padding: 6px 12px; border-radius: var(--radius-full); background: rgba(26, 21, 18, 0.6); border: 1px solid var(--border-gold); color: var(--text-muted); font-size: 0.82rem; cursor: pointer; transition: all var(--transition-fast); }
    .sidebar__tag:hover { background: rgba(232, 168, 41, 0.1); border-color: var(--gold-600); color: var(--gold-400); }
    .sidebar__tag.active { background: linear-gradient(135deg, var(--gold-700), var(--gold-900)); border-color: var(--gold-500); color: var(--gold-300); box-shadow: var(--glow-gold); }
    .sidebar__divider { height: 1px; background: var(--border-gold); margin: var(--space-sm) 0; }
    .sidebar__stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
    .sidebar__stat { background: var(--bg-card); border-radius: var(--radius-md); padding: var(--space-md); text-align: center; border: 1px solid var(--border-gold); }
    .sidebar__stat-value { font-size: 1.5rem; font-weight: 700; color: var(--gold-500); font-family: var(--font-accent); }
    .sidebar__stat-label { font-size: 0.7rem; color: var(--midnight-500); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
    .sidebar__toggle { background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius-md); padding: var(--space-sm); color: var(--midnight-400); font-size: 14px; cursor: pointer; transition: all var(--transition-fast); }
    .sidebar__toggle:hover { background: rgba(232, 168, 41, 0.1); color: var(--gold-500); }
    /* ===== NOTES PANEL ===== */
    .notes-panel { flex: 1; display: none; flex-direction: column; gap: var(--space-md); }
    .notes-panel.show { display: flex; }
    .notes-list { display: flex; flex-direction: column; gap: var(--space-md); flex: 1; overflow-y: auto; }
    .note-item { background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: var(--radius-lg); padding: var(--space-md); cursor: pointer; transition: all var(--transition-fast); }
    .note-item:hover { background: rgba(232, 168, 41, 0.08); border-color: rgba(232, 168, 41, 0.3); }
    .note-item__header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-sm); }
    .note-item__name { font-weight: 600; color: var(--text-cream); font-size: 0.95rem; }
    .note-item__date { font-size: 0.75rem; color: var(--midnight-500); }
    .note-item__rating { color: var(--gold-500); font-size: 14px; margin-bottom: var(--space-xs); }
    .note-item__text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note-item__actions { display: flex; gap: var(--space-sm); margin-top: var(--space-sm); }
    .note-item__btn { padding: 4px 10px; border-radius: var(--radius-sm); background: var(--bg-elevated); border: 1px solid var(--border-gold); color: var(--midnight-400); font-size: 12px; transition: all var(--transition-fast); }
    .note-item__btn:hover { background: rgba(232, 168, 41, 0.15); color: var(--gold-500); }
    .note-item__btn.delete:hover { background: rgba(139, 41, 66, 0.3); color: #e85a5a; }
    .notes-empty { text-align: center; padding: var(--space-2xl); color: var(--midnight-500); }
    .notes-empty__icon { font-size: 48px; margin-bottom: var(--space-md); opacity: 0.5; }
    .notes-empty__text { font-size: 0.9rem; }
    .notes-actions { display: flex; gap: var(--space-sm); }
    .notes-action-btn { flex: 1; padding: var(--space-sm); border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid var(--border-gold); color: var(--gold-500); font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: var(--space-xs); transition: all var(--transition-fast); }
    .notes-action-btn:hover { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-600); }
    /* ===== FAVORITES BAR ===== */
    .favorites-bar { position: fixed; left: 0; top: 70px; bottom: 0; width: 48px; background: rgba(13, 10, 8, 0.95); border-right: 1px solid var(--border-gold); z-index: 90; display: flex; flex-direction: column; align-items: center; padding: var(--space-md) 0; gap: var(--space-sm); }
    .favorites-bar__btn { width: 36px; height: 36px; border-radius: var(--radius-md); background: rgba(26, 21, 18, 0.6); border: 1px solid var(--border-gold); color: var(--midnight-400); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-fast); }
    .favorites-bar__btn:hover { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-500); color: var(--gold-500); }
    .favorites-bar__btn.active { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-500); color: var(--gold-500); }
    /* ===== MAIN CONTENT ===== */
    .main-content { flex: 1; padding: var(--space-xl); max-width: 1440px; margin: 0 auto; width: 100%; }
    /* ===== HERO ===== */
    .hero { text-align: center; padding: var(--space-2xl) var(--space-xl); margin-bottom: var(--space-xl); }
    .hero__title { font-family: var(--font-display); font-size: 2.5rem; font-weight: 700; color: var(--text-cream); margin-bottom: var(--space-md); letter-spacing: 0.05em; }
    .hero__subtitle { font-size: 1.1rem; color: var(--midnight-400); margin-bottom: var(--space-lg); }
    .hero__divider { display: flex; align-items: center; justify-content: center; gap: var(--space-lg); color: var(--gold-600); }
    .hero__divider::before, .hero__divider::after { content: ''; width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-700), transparent); }
    .hero__divider-icon { font-size: 24px; }
    /* ===== FILTER PANEL ===== */
    .filter-panel { background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-gold); border-radius: var(--radius-xl); padding: var(--space-lg); margin-bottom: var(--space-xl); }
    .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-lg); }
    .filter-group { display: flex; align-items: center; gap: var(--space-md); }
    .filter-group__label { font-size: 0.8rem; color: var(--midnight-400); letter-spacing: 0.1em; white-space: nowrap; }
    .filter-chip { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-lg); background: rgba(26, 21, 18, 0.6); border: 1px solid var(--border-gold); color: var(--text-cream); font-size: 0.85rem; cursor: pointer; transition: all var(--transition-fast); white-space: nowrap; }
    .filter-chip:hover, .filter-chip.active { background: linear-gradient(135deg, var(--gold-700), var(--gold-900)); border-color: var(--gold-500); color: var(--gold-300); box-shadow: 0 2px 10px rgba(232, 168, 41, 0.2); }
    .filter-divider { width: 1px; height: 32px; background: var(--border-gold); margin: 0 var(--space-sm); }
    .filter-sort { display: flex; align-items: center; gap: var(--space-sm); margin-left: auto; }
    .filter-sort select { padding: var(--space-sm) var(--space-md); background: rgba(26, 21, 18, 0.8); border: 1px solid var(--border-gold); border-radius: var(--radius-md); color: var(--text-cream); font-size: 0.85rem; font-family: inherit; cursor: pointer; transition: all var(--transition-fast); }
    .filter-sort select:focus { border-color: var(--gold-500); outline: none; box-shadow: var(--glow-gold); }
    .filter-sort select option { background: var(--midnight-800); }
    .filter-clear { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); background: transparent; border: 1px solid rgba(219, 138, 95, 0.4); color: var(--copper-400); font-size: 0.8rem; cursor: pointer; transition: all var(--transition-fast); }
    .filter-clear:hover { background: rgba(219, 138, 95, 0.15); border-color: var(--copper-500); }
    .price-quick-chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-left: var(--space-sm); }
    .price-chip { padding: 3px 10px; border-radius: var(--radius-full); background: rgba(26, 21, 18, 0.6); border: 1px solid var(--border-gold); color: var(--text-muted); font-size: 0.75rem; cursor: pointer; transition: all var(--transition-fast); }
    .price-chip:hover, .price-chip.active { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-600); color: var(--gold-400); }
    /* ===== CARDS HEADER ===== */
    .cards-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); padding: 0 var(--space-sm); }
    .cards-count { font-size: 0.9rem; color: var(--midnight-400); }
    .cards-count strong { color: var(--gold-400); font-weight: 600; }
    .view-toggle { display: flex; gap: var(--space-xs); }
    .view-toggle button { width: 38px; height: 38px; border-radius: var(--radius-md); background: rgba(26, 21, 18, 0.6); border: 1px solid var(--border-gold); color: var(--midnight-400); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all var(--transition-fast); }
    .view-toggle button.active { background: rgba(232, 168, 41, 0.15); border-color: var(--gold-500); color: var(--gold-400); }
    .view-toggle button:hover:not(.active) { background: rgba(26, 21, 18, 0.8); color: var(--text-cream); }
    /* ===== CARD GRID ===== */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-xl); }
    .liquor-card { background: var(--bg-elevated); border: 1px solid var(--border-gold); border-radius: var(--radius-xl); overflow: hidden; cursor: pointer; transition: all var(--transition-normal); position: relative; backdrop-filter: blur(10px); }
    .liquor-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(232, 168, 41, 0.03) 0%, transparent 50%); pointer-events: none; }
    .liquor-card:hover { transform: translateY(-8px); border-color: var(--gold-500); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), var(--glow-gold-strong); }
    .liquor-card-image { width: 100%; height: 200px; background: linear-gradient(145deg, var(--midnight-700), var(--midnight-800)); display: flex; align-items: center; justify-content: center; font-size: 56px; color: var(--gold-600); position: relative; overflow: hidden; }
    .liquor-card-image img { width: 100%; height: 100%; object-fit: cover; }
    .liquor-card-image::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, var(--bg-elevated), transparent); }
    .liquor-card-badge { position: absolute; top: var(--space-md); right: var(--space-md); padding: 4px 12px; background: linear-gradient(135deg, rgba(139, 41, 66, 0.9), rgba(107, 31, 50, 0.95)); border: 1px solid rgba(200, 120, 80, 0.3); border-radius: var(--radius-lg); color: var(--gold-300); font-size: 0.7rem; letter-spacing: 0.1em; z-index: 2; backdrop-filter: blur(4px); }

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // 世界烈酒图鉴 v3.0 - 189函数完整架构
    // 深邃鎏金 · 奢华酒廊
    // ═══════════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════════
    // 1. 全局状态与常量 (Functions 1-20)
    // ═══════════════════════════════════════════════════════════════════

    function f01_initGlobalState() { window.DATA = []; window.FILTERED = []; window.FAVORITES = {}; window.TASTING_NOTES = {}; window.ACHIEVEMENTS = {}; window.COMPARE_LIST = []; window.CUR_LANG = 'zh'; window.VIEW_MODE = 'grid'; window.ACTIVE_FILTERS = { type: null, region: null, priceMin: 0, priceMax: Infinity, flavor: null }; window.SORT_MODE = 'default'; window.SEARCH_QUERY = ''; window.SIDEBAR_COLLAPSED = false; window.NOTES_PANEL_OPEN = false; }
    function f02_initConstants() { window.DATA_FILE = 'baijiu_data.json'; window.LS_FAV = 'liquor_favorites_v3'; window.LS_NOTES = 'liquor_tasting_v3'; window.LS_LANG = 'liquor_lang_v3'; window.LS_RECENT = 'liquor_recent_v3'; window.LS_VISITS = 'liquor_visits_v3'; window.LS_ACHIEVE = 'liquor_achievements_v3'; window.LS_COMPARE = 'liquor_compare_v3'; }
    function f03_getDefaultState() { return { data: [], filtered: [], favorites: {}, tastingNotes: {}, achievements: {}, compareList: [], curLang: 'zh', viewMode: 'grid', activeFilters: { type: null, region: null, priceMin: 0, priceMax: Infinity, flavor: null }, sortMode: 'default', searchQuery: '', sidebarCollapsed: false, notesPanelOpen: false }; }
    function f04_setState(key, value) { if (window._state) window._state[key] = value; }
    function f05_getState(key) { return window._state ? window._state[key] : null; }
    function f06_resetState() { window._state = f03_getDefaultState(); }
    function f07_validateState() { const required = ['data', 'filtered', 'favorites', 'tastingNotes', 'curLang', 'viewMode']; return required.every(k => window._state && window._state.hasOwnProperty(k)); }
    function f08_serializeState() { return JSON.stringify({ data: window.DATA, favorites: window.FAVORITES, tastingNotes: window.TASTING_NOTES, achievements: window.ACHIEVEMENTS, compareList: window.COMPARE_LIST, curLang: window.CUR_LANG }); }
    function f09_deserializeState(json) { try { const s = JSON.parse(json); if (s.favorites) window.FAVORITES = s.favorites; if (s.tastingNotes) window.TASTING_NOTES = s.tastingNotes; if (s.achievements) window.ACHIEVEMENTS = s.achievements; if (s.compareList) window.COMPARE_LIST = s.compareList; if (s.curLang) window.CUR_LANG = s.curLang; } catch (e) { console.error('State deserialization failed:', e); } }
    function f10_getStorageKey(suffix) { return 'liquor_' + suffix + '_v3'; }
    function f11_saveToStorage(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('Storage save failed:', e); } }
    function f12_loadFromStorage(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { console.error('Storage load failed:', e); return null; } }
    function f13_clearStorage(key) { try { localStorage.removeItem(key); } catch (e) { console.error('Storage clear failed:', e); } }
    function f14_initStorage() { f01_initGlobalState(); f02_initConstants(); const fav = f12_loadFromStorage(window.LS_FAV); if (fav) window.FAVORITES = fav; const notes = f12_loadFromStorage(window.LS_NOTES); if (notes) window.TASTING_NOTES = notes; const lang = f12_loadFromStorage(window.LS_LANG); if (lang) window.CUR_LANG = lang; const achieve = f12_loadFromStorage(window.LS_ACHIEVE); if (achieve) window.ACHIEVEMENTS = achieve; const compare = f12_loadFromStorage(window.LS_COMPARE); if (compare) window.COMPARE_LIST = compare; }
    function f15_saveAllStorage() { f11_saveToStorage(window.LS_FAV, window.FAVORITES); f11_saveToStorage(window.LS_NOTES, window.TASTING_NOTES); f11_saveToStorage(window.LS_LANG, window.CUR_LANG); f11_saveToStorage(window.LS_ACHIEVE, window.ACHIEVEMENTS); f11_saveToStorage(window.LS_COMPARE, window.COMPARE_LIST); }
    function f16_exportState() { return { version: '3.0', timestamp: Date.now(), favorites: window.FAVORITES, tastingNotes: window.TASTING_NOTES, achievements: window.ACHIEVEMENTS, compareList: window.COMPARE_LIST, lang: window.CUR_LANG }; }
    function f17_importState(state) { if (!state || !state.version) return false; window.FAVORITES = state.favorites || {}; window.TASTING_NOTES = state.tastingNotes || {}; window.ACHIEVEMENTS = state.achievements || {}; window.COMPARE_LIST = state.compareList || []; window.CUR_LANG = state.lang || 'zh'; f15_saveAllStorage(); return true; }
    function f18_getStateSize() { return JSON.stringify(window._state).length; }
    function f19_clearAllState() { window.DATA = []; window.FILTERED = []; window.FAVORITES = {}; window.TASTING_NOTES = {}; window.ACHIEVEMENTS = {}; window.COMPARE_LIST = []; }
    function f20_initAutoDarkMode() { const hour = new Date().getHours(); if (hour >= 23 || hour < 6) { document.documentElement.setAttribute('data-theme', 'dark'); } setInterval(() => { const h = new Date().getHours(); if ((h >= 23 || h < 6) && !document.documentElement.hasAttribute('data-theme')) { document.documentElement.setAttribute('data-theme', 'dark'); } }, 60000); }

    // ═══════════════════════════════════════════════════════════════════
    // 2. 数据加载与初始化 (Functions 21-40)
    // ═══════════════════════════════════════════════════════════════════

    function f21_async_loadData() { return new Promise(async (resolve, reject) => { try { const res = await fetch(window.DATA_FILE); if (!res.ok) throw new Error('Failed to load data'); window.DATA = await res.json(); window.FILTERED = [...window.DATA]; f14_initStorage(); f20_initAutoDarkMode(); resolve(window.DATA); } catch (err) { console.error('Data load failed:', err); reject(err); } }); }
    function f22_initApp() { f01_initGlobalState(); f02_initConstants(); f14_initStorage(); f20_initAutoDarkMode(); }
    function f23_async_initAndLoad() { return new Promise(async (resolve) => { f22_initApp(); try { await f21_async_loadData(); f25_initUI(); f37_hideLoading(); f43_setupKeyboardNav(); f44_setupTouchGestures(); resolve(true); } catch (err) { f58_showToast('数据加载失败，请刷新重试', 'error'); resolve(false); } }); }
    function f24_validateData() { if (!Array.isArray(window.DATA) || window.DATA.length === 0) return false; return window.DATA.every(item => item.id && item.name); }
    function f25_initUI() { f26_initLang(); f27_renderTypeFilters(); f28_renderRegionFilters(); f29_renderPriceFilters(); f30_renderFlavorFilters(); f31_applyFilters(); f32_updateStats(); f33_setupSearch(); f34_setupInfiniteScroll(); f35_bindGlobalEvents(); }
    function f26_initLang() { const btn = document.getElementById('langBtn'); if (btn) btn.textContent = window.CUR_LANG === 'zh' ? '中' : 'EN'; }
    function f27_renderTypeFilters() { const types = [...new Set(window.DATA.map(d => d.type))].filter(Boolean).sort(); const sidebar = document.getElementById('typeFilters'); const filter = document.getElementById('filterTypeChips'); if (sidebar) sidebar.innerHTML = types.map(t => `<span class="sidebar__tag" data-type="${f63_escHtml(t)}" onclick="f91_toggleTypeFilter('${f63_escHtml(t)}')">${f63_escHtml(t)}</span>`).join(''); if (filter) filter.innerHTML = types.map(t => `<span class="filter-chip" data-type="${f63_escHtml(t)}" onclick="f91_toggleTypeFilter('${f63_escHtml(t)}')">${f63_escHtml(t)}</span>`).join(''); }
    function f28_renderRegionFilters() { const regions = [...new Set(window.DATA.map(d => d.region))].filter(Boolean).sort(); const sidebar = document.getElementById('regionFilters'); const filter = document.getElementById('filterRegionChips'); if (sidebar) sidebar.innerHTML = regions.map(r => `<span class="sidebar__tag" data-region="${f63_escHtml(r)}" onclick="f92_toggleRegionFilter('${f63_escHtml(r)}')">${f63_escHtml(r)}</span>`).join(''); if (filter) filter.innerHTML = regions.map(r => `<span class="filter-chip" data-region="${f63_escHtml(r)}" onclick="f92_toggleRegionFilter('${f63_escHtml(r)}')">${f63_escHtml(r)}</span>`).join(''); }
    function f29_renderPriceFilters() { const prices = ['0-100', '100-300', '300-500', '500-1000', '1000+']; const labels = { '0-100': '百元内', '100-300': '100-300', '300-500': '300-500', '500-1000': '500-1k', '1000+': '千元+' }; const sidebar = document.getElementById('priceFilters'); const filter = document.getElementById('priceChips'); const html = prices.map(p => `<span class="sidebar__tag" data-price="${p}" onclick="f93_togglePriceFilter('${p}')">${labels[p]}</span>`).join(''); if (sidebar) sidebar.innerHTML = html; if (filter) filter.innerHTML = html; }
    function f30_renderFlavorFilters() { const flavors = [...new Set(window.DATA.flatMap(d => d.flavor_tags || []))].filter(Boolean).sort().slice(0, 12); const container = document.getElementById('flavorFilters'); if (container) container.innerHTML = flavors.map(f => `<span class="sidebar__tag" data-flavor="${f63_escHtml(f)}" onclick="f94_toggleFlavorFilter('${f63_escHtml(f)}')">${f63_escHtml(f)}</span>`).join(''); }
    function f31_applyFilters() { let result = [...window.DATA]; if (window.SEARCH_QUERY) { const q = window.SEARCH_QUERY.toLowerCase(); result = result.filter(d => (d.name && d.name.toLowerCase().includes(q)) || (d.ename && d.ename.toLowerCase().includes(q)) || (d.type && d.type.toLowerCase().includes(q)) || (d.region && d.region.toLowerCase().includes(q))); } if (window.ACTIVE_FILTERS.type) { result = result.filter(d => d.type === window.ACTIVE_FILTERS.type); } if (window.ACTIVE_FILTERS.region) { result = result.filter(d => d.region === window.ACTIVE_FILTERS.region); } if (window.ACTIVE_FILTERS.flavor) { result = result.filter(d => d.flavor_tags && d.flavor_tags.includes(window.ACTIVE_FILTERS.flavor)); } if (window.ACTIVE_FILTERS.priceMin > 0 || window.ACTIVE_FILTERS.priceMax < Infinity) { result = result.filter(d => { const p = d.price || 0; return p >= window.ACTIVE_FILTERS.priceMin && p <= window.ACTIVE_FILTERS.priceMax; }); } window.FILTERED = result; f36_sortFiltered(); f39_renderCards(); f40_updateCount(); }
    function f32_updateStats() { document.getElementById('totalCount').textContent = window.DATA.length; document.getElementById('favCount').textContent = Object.keys(window.FAVORITES).length; document.getElementById('notesCount').textContent = Object.keys(window.TASTING_NOTES).length; document.getElementById('achieveCount').textContent = Object.values(window.ACHIEVEMENTS).filter(a => a.unlocked).length; }
    function f33_setupSearch() { const input = document.getElementById('searchInput'); if (!input) return; input.addEventListener('input', f53_debounce(function() { window.SEARCH_QUERY = input.value.trim(); f31_applyFilters(); f57_renderAutocomplete(); }, 300)); input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { performSearch(); input.blur(); } else if (e.key === 'Escape') { clearSearch(); input.blur(); } }); input.addEventListener('focus', function() { if (input.value.trim()) f57_renderAutocomplete(); }); document.addEventListener('click', function(e) { if (!e.target.closest('.header__search')) f54_hideAutocomplete(); }); }
    function f34_setupInfiniteScroll() { let isLoading = false; window.addEventListener('scroll', function() { if (isLoading) return; const scrollY = window.scrollY || window.pageYOffset; const docH = document.documentElement.scrollHeight; const winH = window.innerHeight; if (scrollY + winH >= docH - 500) { isLoading = true; setTimeout(() => { isLoading = false; }, 500); } }); }
    function f35_bindGlobalEvents() { document.querySelectorAll('.filter-chip, .sidebar__tag').forEach(el => { el.addEventListener('mouseenter', function() { this.style.transform = 'translateY(-2px)'; }); el.addEventListener('mouseleave', function() { this.style.transform = ''; }); }); }
    function f36_sortFiltered() { const mode = window.SORT_MODE; if (mode === 'default') return; window.FILTERED.sort((a, b) => { if (mode === 'price-asc') return (a.price || 0) - (b.price || 0); if (mode === 'price-desc') return (b.price || 0) - (a.price || 0); if (mode === 'score-desc') return (b.score || 0) - (a.score || 0); if (mode === 'abv-desc') return (b.abv || 0) - (a.abv || 0); if (mode === 'name-asc') return (a.name || '').localeCompare(b.name || '', 'zh'); return 0; }); }
    function f37_hideLoading() { const el = document.getElementById('initialLoading'); if (el) el.style.display = 'none'; const app = document.getElementById('app'); if (app) app.style.display = 'block'; }
    function f38_showLoading() { const el = document.getElementById('initialLoading'); if (el) el.style.display = 'flex'; const app = document.getElementById('app'); if (app) app.style.display = 'none'; }
    function f39_renderCards() { const grid = document.getElementById('cardGrid'); if (!grid) return; if (window.FILTERED.length === 0) { grid.innerHTML = ''; document.getElementById('emptyState').style.display = 'block'; return; } document.getElementById('emptyState').style.display = 'none'; grid.innerHTML = window.FILTERED.map((d, i) => f60_renderCard(d, i)).join(''); }
    function f40_updateCount() { document.getElementById('countDisplay').textContent = window.FILTERED.length; }

    // ═══════════════════════════════════════════════════════════════════
    // 3. 搜索与筛选 (Functions 41-60)
    // ═══════════════════════════════════════════════════════════════════

    function f41_performSearch() { const input = document.getElementById('searchInput'); if (!input) return; window.SEARCH_QUERY = input.value.trim(); f31_applyFilters(); f54_hideAutocomplete(); if (window.SEARCH_QUERY) f55_saveSearchHistory(window.SEARCH_QUERY); }
    function f42_clearSearch() { const input = document.getElementById('searchInput'); if (input) input.value = ''; window.SEARCH_QUERY = ''; f31_applyFilters(); f54_hideAutocomplete(); }
    function f43_setupKeyboardNav() { document.addEventListener('keydown', function(e) { if (e.key === '/' && !e.target.matches('input, textarea')) { e.preventDefault(); document.getElementById('searchInput').focus(); } if (e.key === 'Escape') { f54_hideAutocomplete(); closeAllModals(); } }); }
    function f44_setupTouchGestures() { let startX = 0; document.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }); document.addEventListener('touchend', e => { const diff = startX - e.changedTouches[0].screenX; if (Math.abs(diff) > 100) { if (diff > 0) f97_closeSidebar(); else f96_openSidebar(); } }); }
    function f45_toggleLang() { window.CUR_LANG = window.CUR_LANG === 'zh' ? 'en' : 'zh'; f11_saveToStorage(window.LS_LANG, window.CUR_LANG); f26_initLang(); f39_renderCards(); f58_showToast('语言已切换为' + (window.CUR_LANG === 'zh' ? '中文' : 'English')); }
    function f46_randomPick() { if (!window.DATA.length) return; const item = window.DATA[Math.floor(Math.random() * window.DATA.length)]; f69_openDetailModal(item.id); f59_addToRecent(item.id); f58_showToast('🎲 随机推荐：' + item.name); }
    function f47_toggleSidebar() { const sidebar = document.getElementById('sidebar'); const panel = document.getElementById('notesPanel'); if (window.NOTES_PANEL_OPEN) { panel.classList.remove('show'); window.NOTES_PANEL_OPEN = false; } else { sidebar.classList.toggle('mobile-open'); } }

    function f137_checkAchievementProgress(id) { const achieve = f136_getAchievementsList().find(a => a.id === id); if (!achieve) return { unlocked: false, progress: 0 }; if (window.ACHIEVEMENTS[id] && window.ACHIEVEMENTS[id].unlocked) return { unlocked: true, progress: 100 }; let progress = 0; const cond = achieve.condition; if (cond.startsWith('favorites')) { const threshold = parseInt(cond.split('>=')[1]); progress = Math.min(100, (Object.keys(window.FAVORITES).length / threshold) * 100); } else if (cond.startsWith('notes')) { const threshold = parseInt(cond.split('>=')[1]); progress = Math.min(100, (Object.keys(window.TASTING_NOTES).length / threshold) * 100); } else if (cond.startsWith('visited')) { const threshold = parseInt(cond.split('>=')[1]); const visits = JSON.parse(localStorage.getItem(window.LS_VISITS) || '{}'); const count = Object.keys(visits).length; progress = Math.min(100, (count / threshold) * 100); } return { unlocked: window.ACHIEVEMENTS[id] && window.ACHIEVEMENTS[id].unlocked, progress: Math.round(progress) }; }
