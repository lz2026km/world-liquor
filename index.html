<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界烈酒图鉴 · World Liquor Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ================================================
       世界烈酒图鉴 v2.0 华丽UI
       深邃藏蓝 + 鎏金奢华风格
       ================================================ */
    
    /* ===== 内联Critical CSS ===== */
    body {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      background: #050303;
      color: #e8e0d8;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ===== Loading State ===== */
    .initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }
    .initial-loading__icon {
      font-size: 72px;
      animation: float 2s ease-in-out infinite;
    }
    .initial-loading__text {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #e8a829;
      letter-spacing: 0.2em;
    }
    .initial-loading__bar {
      width: 200px;
      height: 3px;
      background: rgba(232, 168, 41, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .initial-loading__bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #e8a829, #f5cc6a);
      border-radius: 2px;
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ===== Favorites Bar ===== */
    .favorites-bar {
      position: fixed;
      left: 0;
      top: 68px;
      bottom: 0;
      width: 48px;
      background: rgba(13, 10, 8, 0.95);
      border-right: 1px solid rgba(232, 168, 41, 0.2);
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 8px;
    }
    .favorites-bar__btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(26, 21, 18, 0.6);
      border: 1px solid rgba(232, 168, 41, 0.2);
      color: #9a8b7a;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .favorites-bar__btn:hover {
      background: rgba(232, 168, 41, 0.15);
      border-color: #e8a829;
      color: #e8a829;
    }
    .favorites-bar__btn.active {
      background: rgba(232, 168, 41, 0.15);
      border-color: #e8a829;
      color: #e8a829;
    }

    /* ===== Lang Toggle ===== */
    .lang-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(26, 21, 18, 0.6);
      border: 1px solid rgba(232, 168, 41, 0.2);
      color: #e8e0d8;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    .lang-btn:hover {
      background: rgba(232, 168, 41, 0.2);
      border-color: #e8a829;
      color: #e8a829;
    }
    .lang-btn.active {
      background: rgba(232, 168, 41, 0.2);
      border-color: #e8a829;
      color: #e8a829;
    }

    /* ===== Notes Panel ===== */
    .notes-item {
      padding: 12px 14px;
      background: rgba(26, 21, 18, 0.6);
      border: 1px solid rgba(232, 168, 41, 0.15);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .notes-item:hover {
      background: rgba(232, 168, 41, 0.08);
      border-color: rgba(232, 168, 41, 0.3);
    }
    .notes-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .notes-item-name {
      font-size: 14px;
      color: #e8e0d8;
      font-weight: 600;
    }
    .notes-item-rating {
      color: #e8a829;
      font-size: 12px;
    }
    .notes-item-text {
      font-size: 12px;
      color: #9a8b7a;
      line-height: 1.5;
    }
    .notes-item-date {
      font-size: 11px;
      color: #6b5d4d;
      margin-top: 4px;
    }
    .sidebar-empty {
      text-align: center;
      padding: 48px 24px;
      color: #6b5d4d;
    }
    .sidebar-empty__icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    .sidebar-empty__text {
      font-size: 14px;
    }

    /* ===== Hot This Week ===== */
    .hot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hot-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(26, 21, 18, 0.4);
      border: 1px solid rgba(232, 168, 41, 0.1);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .hot-item:hover {
      background: rgba(232, 168, 41, 0.08);
      border-color: rgba(232, 168, 41, 0.25);
    }
    .hot-rank {
      font-size: 14px;
      font-weight: 700;
      color: #e8a829;
      width: 24px;
      text-align: center;
    }
    .hot-name {
      flex: 1;
      font-size: 13px;
      color: #e8e0d8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hot-count {
      font-size: 11px;
      color: #6b5d4d;
    }

    /* ===== Tag Select ===== */
    .fav-tag-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .fav-tag-option {
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(26, 21, 18, 0.6);
      border: 1px solid rgba(232, 168, 41, 0.2);
      color: #c9bfb5;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .fav-tag-option:hover,
    .fav-tag-option.active {
      background: rgba(232, 168, 41, 0.15);
      border-color: #e8a829;
      color: #e8a829;
    }

    /* ===== Import/Export ===== */
    .import-export-btns {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .import-btn, .export-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .import-btn {
      background: rgba(32, 178, 170, 0.15);
      border: 1px solid rgba(32, 178, 170, 0.3);
      color: #5fbfb3;
    }
    .import-btn:hover {
      background: rgba(32, 178, 170, 0.25);
      border-color: rgba(32, 178, 170, 0.5);
    }
    .export-btn {
      background: rgba(232, 168, 41, 0.1);
      border: 1px solid rgba(232, 168, 41, 0.25);
      color: #e8a829;
    }
    .export-btn:hover {
      background: rgba(232, 168, 41, 0.2);
      border-color: rgba(232, 168, 41, 0.4);
    }

    /* ===== Overlay ===== */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 85;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== Tasting Stars in Modal ===== */
    .modal__stars {
      display: flex;
      gap: 4px;
      margin: 8px 0;
    }
    .modal__stars span {
      font-size: 20px;
      color: #4a3f32;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal__stars span.active,
    .modal__stars span:hover {
      color: #e8a829;
      transform: scale(1.15);
    }

    /* ===== Ingredient Tags ===== */
    .ingredient-diagram {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .ingredient-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(232, 168, 41, 0.06);
      border: 1px solid rgba(232, 168, 41, 0.15);
      border-radius: 20px;
      font-size: 12px;
      color: #c9bfb5;
    }
    .ingredient-icon {
      font-size: 16px;
    }

    /* ===== Scene Tags ===== */
    .scene-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .scene-tag {
      padding: 6px 14px;
      background: rgba(139, 41, 66, 0.15);
      border: 1px solid rgba(139, 41, 66, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #da8a5f;
    }

    /* ===== Awards ===== */
    .awards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .award-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(232, 168, 41, 0.05);
      border-radius: 8px;
      font-size: 13px;
      color: #c9bfb5;
    }
    .award-icon {
      font-size: 16px;
    }

    /* ===== Score Display ===== */
    .score-display {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
    }
    .score-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2d2520, #1a1512);
      border: 2px solid rgba(232, 168, 41, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .score-value {
      font-size: 28px;
      font-weight: 700;
      color: #e8a829;
      line-height: 1;
    }
    .score-label {
      font-size: 10px;
      color: #6b5d4d;
      letter-spacing: 0.1em;
    }
    .score-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .score-bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-bar-label {
      width: 50px;
      font-size: 11px;
      color: #6b5d4d;
    }
    .score-bar-track {
      flex: 1;
      height: 6px;
      background: rgba(232, 168, 41, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #c4891a, #e8a829);
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .score-bar-value {
      width: 24px;
      font-size: 11px;
      color: #9a8b7a;
      text-align: right;
    }

    /* ===== Cocktail Section ===== */
    .cocktail-hint {
      padding: 12px 16px;
      background: rgba(32, 178, 170, 0.08);
      border: 1px solid rgba(32, 178, 170, 0.2);
      border-radius: 12px;
      margin-top: 12px;
    }
    .cocktail-name {
      font-size: 14px;
      font-weight: 600;
      color: #5fbfb3;
      margin-bottom: 4px;
    }
    .cocktail-method {
      font-size: 12px;
      color: #6b5d4d;
    }

    /* ===== Storage Info ===== */
    .storage-hint {
      padding: 10px 14px;
      background: rgba(232, 168, 41, 0.05);
      border-radius: 8px;
      font-size: 12px;
      color: #6b5d4d;
      line-height: 1.6;
    }

    /* ===== History Quote ===== */
    .history-quote {
      padding: 16px;
      background: linear-gradient(135deg, rgba(232, 168, 41, 0.05), rgba(139, 41, 66, 0.03));
      border-left: 3px solid #e8a829;
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: #9a8b7a;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <!-- 初始加载状态 -->
  <div id="initialLoading" class="initial-loading">
    <div class="initial-loading__icon">🍷</div>
    <div class="initial-loading__text">世界烈酒图鉴</div>
    <div class="initial-loading__bar"></div>
  </div>

  <!-- 收藏侧边栏 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <span class="sidebar__title">🍾 品酒笔记</span>
      <button class="sidebar__close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar__content">
      <div id="notesList">
        <div class="sidebar-empty">
          <div class="sidebar-empty__icon">📝</div>
          <div class="sidebar-empty__text">暂无品酒笔记</div>
        </div>
      </div>
      <div class="import-export-btns">
        <button class="import-btn" onclick="importNotes()">📥 导入笔记</button>
        <button class="export-btn" onclick="exportNotes()">📤 导出笔记</button>
      </div>
      <div class="import-export-btns">
        <button class="import-btn" onclick="importAllData()">📥 导入数据</button>
        <button class="export-btn" onclick="exportAllData()">📤 导出数据</button>
      </div>
      <div class="import-export-btns">
        <button class="export-btn" onclick="exportFavoritesJSON()" style="flex:1">📤 导出收藏</button>
      </div>
    </div>
  </aside>

  <!-- 收藏快捷栏 -->
  <nav class="favorites-bar">
    <button class="favorites-bar__btn" id="favBtn" onclick="toggleSidebar()" title="品酒笔记">📝</button>
    <button class="favorites-bar__btn" id="compareOpenBtn" onclick="openCompare()" title="比较" style="display:none">⚖️</button>
  </nav>

  <!-- Header -->
  <header class="header">
    <div class="header__container">
      <a href="#" class="header__brand">
        <div class="header__logo">
          <span class="header__logo-icon">🥃</span>
        </div>
        <div class="header__titles">
          <span class="header__title">世界烈酒图鉴</span>
          <span class="header__subtitle">World Liquor Gallery</span>
        </div>
      </a>

      <div class="header__search">
        <div class="search-bar">
          <span class="search-bar__icon">🔍</span>
          <input type="text" class="search-bar__input" id="searchInput" placeholder="搜索烈酒名称、类型、产地..." autocomplete="off">
          <button class="search-bar__clear" onclick="document.getElementById('searchInput').value='';document.getElementById('searchInput').focus()">✕</button>
          <button class="search-bar__submit" onclick="performSearch()">搜索</button>
        </div>
        <div class="search-autocomplete" id="searchAutocomplete"></div>
      </div>

      <div class="header__actions">
        <button class="random-btn" onclick="randomPick()" title="随机推荐">🎲</button>
        <button class="lang-btn active" id="langBtn" onclick="toggleLang()">中</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1 class="hero__title">世界烈酒图鉴</h1>
    <p class="hero__subtitle">探索全球200款顶级烈酒的奥秘</p>
    <div class="hero__divider">
      <span class="hero__divider-icon">🥃</span>
    </div>
  </section>

  <!-- Filter Panel -->
  <section class="filter-panel">
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-group__label">类型</span>
        <div id="typeFilters"></div>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-group">
        <span class="filter-group__label">产区</span>
        <div id="regionFilters"></div>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-group">
        <span class="filter-group__label">价格</span>
        <div class="price-quick-chips">
          <span class="price-chip" data-quick-price="0-100">百元内</span>
          <span class="price-chip" data-quick-price="100-300">100-300</span>
          <span class="price-chip" data-quick-price="300-500">300-500</span>
          <span class="price-chip" data-quick-price="500-1000">500-1k</span>
          <span class="price-chip" data-quick-price="1000+">千元+</span>
        </div>
      </div>
      <div class="filter-sort">
        <select id="sortSelect" onchange="handleSort(this.value)">
          <option value="default">默认排序</option>
          <option value="price-asc">价格 ↑</option>
          <option value="price-desc">价格 ↓</option>
          <option value="score-desc">评分最高</option>
          <option value="abv-desc">酒精度数</option>
        </select>
        <button class="filter-clear" onclick="clearFilters()">重置</button>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <div class="cards-header">
      <span class="cards-count">共 <strong id="countDisplay">0</strong> 款烈酒</span>
      <div class="view-toggle">
        <button id="gridView" class="active" onclick="switchView('grid')" title="网格视图">⊞</button>
        <button id="listView" onclick="switchView('list')" title="列表视图">☰</button>
      </div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <!-- Compare Bar -->
  <div class="compare-bar" id="compareBar">
    <span class="compare-bar__title">
      <span class="compare-bar__title-icon">⚖️</span>
      比较 (<span id="compareCount">0</span>)
    </span>
    <div class="compare-items" id="compareItems"></div>
    <button class="compare-btn" onclick="showCompareModal()">开始比较</button>
  </div>

  <!-- Compare Modal -->
  <div class="compare-modal-overlay" id="compareModalOverlay">
    <div class="compare-modal">
      <div class="compare-modal__header">
        <span class="compare-modal__title">烈酒比较</span>
        <button class="compare-modal__close" onclick="closeCompareModal()">✕</button>
      </div>
      <div class="compare-modal__body" id="compareModalBody"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modal">
    <button class="modal__close" onclick="closeModal()">✕</button>
    <div class="modal__image" id="modalImage">🍷</div>
    <div class="modal__content" id="modalContent"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════════
    // 世界烈酒图鉴 v2.0 - JavaScript Engine
    // ═══════════════════════════════════════════

    // ── 全局状态 ──
    let DATA = [];
    let filtered = [];
    let favorites = {};
    let TASTING_NOTES = {};
    let COMPARE_LIST = [];
    let CUR_LANG = 'zh';
    let VIEW_MODE = 'grid';
    let ACTIVE_FILTERS = { type: null, region: null, priceMin: 0, priceMax: Infinity };

    // ── 常量 ──
    const DATA_FILE = 'baijiu_data.json';
    const LS_FAV = 'liquor_favorites_v2';
    const LS_NOTES = 'liquor_tasting_v2';
    const LS_LANG = 'liquor_lang_v2';

    // ── 自动暗色模式（23:00-06:00）──
    function initAutoDarkMode() {
      const hour = new Date().getHours();
      if (hour >= 23 || hour < 6) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      setInterval(() => {
        const h = new Date().getHours();
        if ((h >= 23 || h < 6) && !document.documentElement.hasAttribute('data-theme')) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      }, 60000);
    }

    // ── 工具函数 ──
    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatPrice(p) {
      if (p >= 10000) return Math.floor(p / 10000) + '万+';
      return p.toLocaleString();
    }

    // ── 随机推荐 ──
    function randomPick() {
      if (!DATA.length) return;
      const item = DATA[Math.floor(Math.random() * DATA.length)];
      openM(item.id);
      showToast('🎲 随机推荐：' + item.name);
    }

    // ── 最近浏览 ──
    const LS_RECENT = 'liquor_recent_v2';
    function addToRecent(id) {
      try {
        let recent = JSON.parse(localStorage.getItem(LS_RECENT) || '[]');
        recent = recent.filter(r => r !== id);
        recent.unshift(id);
        recent = recent.slice(0, 10);
        localStorage.setItem(LS_RECENT, JSON.stringify(recent));
      } catch (e) {}
    }
    function getRecent() {
      try { return JSON.parse(localStorage.getItem(LS_RECENT) || '[]'); } catch (e) { return []; }
    }

    // ── 搜索关键词高亮 ──
    function getHighlightedText(text, query) {
      if (!query || !text) return escHtml(text || '');
      const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escHtml(text).replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    // ── 社交分享 ──
    function shareItem(id) {
      const d = DATA.find(x => x.id === id);
      if (!d) return;
      const text = '🍷 ' + d.name + '（' + (d.ename||'') + '）- 世界烈酒图鉴';
      const url = window.location.href.split('?')[0] + '?id=' + id;
      if (navigator.share) {
        navigator.share({ title: d.name, text: text, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text + ' ' + url).then(() => showToast('🔗 链接已复制'));
      }
    }

    // ── 导出收藏JSON ──
    function exportFavoritesJSON() {
      const favs = Object.keys(favorites);
      if (!favs.length) { showToast('暂无收藏'); return; }
      const items = favs.map(id => DATA.find(d => d.id === id)).filter(Boolean);
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'liquor_favorites_' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(url);
      showToast('📤 收藏已导出');
    }

    // ── 导出/导入全部数据 ──
    function exportAllData() {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'world_liquor_' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(url);
      showToast('📤 全量数据已导出');
    }
    function importAllData() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (Array.isArray(imported)) {
              DATA = imported; filtered = [...DATA];
              initUI(); showToast('📥 导入 ' + DATA.length + ' 条数据');
            } else { showToast('数据格式错误'); }
          } catch (err) { showToast('导入失败'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // ── 访问统计（本周热门）──
    const LS_VISITS = 'liquor_visits_v2';
    function updateVisitCount(id) {
      try {
        let visits = JSON.parse(localStorage.getItem(LS_VISITS) || '{}');
        visits[id] = (visits[id] || 0) + 1;
        localStorage.setItem(LS_VISITS, JSON.stringify(visits));
      } catch (e) {}
    }
    function getTopVisited() {
      try {
        const visits = JSON.parse(localStorage.getItem(LS_VISITS) || '{}');
        return Object.entries(visits).sort((a,b) => b[1]-a[1]).slice(0,5).map(e => e[0]);
      } catch (e) { return []; }
    }

    // ── 数据加载 ──
    async function loadData() {
      try {
        const res = await fetch(DATA_FILE);
        if (!res.ok) throw new Error('Failed to load data');
        DATA = await res.json();
        filtered = [...DATA];
        loadFromStorage();
        initUI();
        hideInitialLoading();
      } catch (err) {
        console.error('数据加载失败:', err);
        showToast('数据加载失败，请刷新重试');
      }
    }

    function loadFromStorage() {
      try {
        const fav = localStorage.getItem(LS_FAV);
        if (fav) favorites = JSON.parse(fav);
        const notes = localStorage.getItem(LS_NOTES);
        if (notes) TASTING_NOTES = JSON.parse(notes);
        const lang = localStorage.getItem(LS_LANG);
        if (lang) CUR_LANG = lang;
      } catch (e) {}
    }

    function saveFavorites() {
      localStorage.setItem(LS_FAV, JSON.stringify(favorites));
      updateFavoritesBadge();
    }

    function saveTastingNotes() {
      localStorage.setItem(LS_NOTES, JSON.stringify(TASTING_NOTES));
    }

    // ── UI初始化 ──
    function initUI() {
      initAutoDarkMode();
      initLang();
      renderTypeFilters();
      renderRegionFilters();
      renderTags();
      applyFilters();
      updateFavoritesBadge();
      setupSearch();
      setupKeyboardNav();
    }

    function hideInitialLoading() {
      const el = document.getElementById('initialLoading');
      if (el) el.style.display = 'none';
    }

    // ── 语言切换 ──
    function initLang() {
      const btn = document.getElementById('langBtn');
      if (btn) btn.textContent = CUR_LANG === 'zh' ? '中' : 'EN';
    }

    function toggleLang() {
      CUR_LANG = CUR_LANG === 'zh' ? 'en' : 'zh';
      localStorage.setItem(LS_LANG, CUR_LANG);
      initLang();
      applyFilters();
    }

    // ── 筛选器 ──
    function renderTypeFilters() {
      const types = [...new Set(DATA.map(d => d.type))].filter(Boolean).sort();
      const container = document.getElementById('typeFilters');
      if (!container) return;
      container.innerHTML = types.map(t => 
        `<span class="filter-chip" data-type="${escHtml(t)}" onclick="toggleTypeFilter('${escHtml(t)}')">${escHtml(t)}</span>`
      ).join('');
    }

    function renderRegionFilters() {
      const regions = [...new Set(DATA.map(d => d.region))].filter(Boolean).sort();
      const container = document.getElementById('regionFilters');
      if (!container) return;
      container.innerHTML = regions.map(r => 
        `<span class="filter-chip" data-region="${escHtml(r)}" onclick="toggleRegionFilter('${escHtml(r)}')">${escHtml(r)}</span>`
      ).join('');
    }

    function toggleTypeFilter(type) {
      if (ACTIVE_FILTERS.type === type) {
        ACTIVE_FILTERS.type = null;
      } else {
        ACTIVE_FILTERS.type = type;
      }
      document.querySelectorAll('#typeFilters .filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.type === ACTIVE_FILTERS.type);
      });
      applyFilters();
    }

    function toggleRegionFilter(region) {
      if (ACTIVE_FILTERS.region === region) {
        ACTIVE_FILTERS.region = null;
      } else {
        ACTIVE_FILTERS.region = region;
      }
      document.querySelectorAll('#regionFilters .filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.region === ACTIVE_FILTERS.region);
      });
      applyFilters();
    }

    function applyQuickPriceFilter(range) {
      let min = 0, max = Infinity;
      if (range === '0-100') { min = 0; max = 100; }
      else if (range === '100-300') { min = 100; max = 300; }
      else if (range === '300-500') { min = 300; max = 500; }
      else if (range === '500-1000') { min = 500; max = 1000; }
      else if (range === '1000+') { min = 1000; max = Infinity; }
      
      ACTIVE_FILTERS.priceMin = min;
      ACTIVE_FILTERS.priceMax = max;

      document.querySelectorAll('.price-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.quickPrice === range);
      });
      applyFilters();
    }

    function applyFilters() {
      filtered = DATA.filter(d => {
        if (ACTIVE_FILTERS.type && d.type !== ACTIVE_FILTERS.type) return false;
        if (ACTIVE_FILTERS.region && d.region !== ACTIVE_FILTERS.region) return false;
        if (d.price < ACTIVE_FILTERS.priceMin || d.price >= ACTIVE_FILTERS.priceMax) return false;
        return true;
      });
      renderTags();
      render();
    }

    function clearFilters() {
      ACTIVE_FILTERS = { type: null, region: null, priceMin: 0, priceMax: Infinity };
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.price-chip').forEach(c => c.classList.remove('active'));
      document.getElementById('sortSelect').value = 'default';
      applyFilters();
    }

    function handleSort(value) {
      if (value === 'price-asc') filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
      else if (value === 'price-desc') filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
      else if (value === 'score-desc') filtered.sort((a, b) => (b.score || 0) - (a.score || 0));
      else if (value === 'abv-desc') filtered.sort((a, b) => (b.abv || 0) - (a.abv || 0));
      else filtered = [...DATA].filter(d => passesFilters(d));
      render();
    }

    function passesFilters(d) {
      if (ACTIVE_FILTERS.type && d.type !== ACTIVE_FILTERS.type) return false;
      if (ACTIVE_FILTERS.region && d.region !== ACTIVE_FILTERS.region) return false;
      if (d.price < ACTIVE_FILTERS.priceMin || d.price >= ACTIVE_FILTERS.priceMax) return false;
      return true;
    }

    function renderTags() {
      document.getElementById('countDisplay').textContent = filtered.length;
    }

    // ── 搜索 ──
    function setupSearch() {
      const input = document.getElementById('searchInput');
      const autocomplete = document.getElementById('searchAutocomplete');
      
      input.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) {
          autocomplete.classList.remove('active');
          return;
        }
        const matches = DATA.filter(d => 
          d.name.toLowerCase().includes(q) || 
          (d.ename && d.ename.toLowerCase().includes(q)) ||
          (d.type && d.type.toLowerCase().includes(q))
        ).slice(0, 8);

        if (matches.length) {
          autocomplete.innerHTML = matches.map(m => {
            const highlighted = m.name.replace(new RegExp(`(${q})`, 'gi'), '<span class="highlight">$1</span>');
            return `<div class="search-autocomplete__item" onclick="openM('${m.id}'); document.getElementById('searchInput').value=''; autocomplete.classList.remove('active');">
              <span>🍷</span><span>${highlighted}</span><span style="color:#6b5d4d;font-size:12px">${escHtml(m.type || '')}</span>
            </div>`;
          }).join('');
          autocomplete.classList.add('active');
        } else {
          autocomplete.classList.remove('active');
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          performSearch();
          autocomplete.classList.remove('active');
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.header__search')) {
          autocomplete.classList.remove('active');
        }
      });
    }

    function performSearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) return;
      
      const match = DATA.find(d => 
        d.name.toLowerCase().includes(q) || 
        (d.ename && d.ename.toLowerCase().includes(q))
      );
      if (match) {
        openM(match.id);
        document.getElementById('searchInput').value = '';
        document.getElementById('searchAutocomplete').classList.remove('active');
      }
    }

    // ── 视图切换 ──
    function switchView(mode) {
      VIEW_MODE = mode;
      document.getElementById('gridView').classList.toggle('active', mode === 'grid');
      document.getElementById('listView').classList.toggle('active', mode === 'list');
      document.getElementById('cardGrid').classList.toggle('list-view', mode === 'list');
    }

    // ── 卡片渲染 ──
    function render() {
      const grid = document.getElementById('cardGrid');
      const currentFiltered = filtered.length ? filtered : DATA;
      const query = (document.getElementById('searchInput') || {}).value || '';

      grid.innerHTML = currentFiltered.map((d, i) => {
        const isFav = favorites[d.id];
        const tags = (d.flavor_tags || []).slice(0, 4).map(t => `<span class="liquor-tag">${escHtml(t)}</span>`).join('');
        const priceDisplay = formatPrice(d.price || 0);
        const nameHtml = query ? getHighlightedText(d.name, query) : escHtml(CUR_LANG === 'zh' ? d.name : (d.ename || d.name));
        const descHtml = query && d.description ? getHighlightedText(d.description.slice(0, 30), query) : '';

        return `
        <article class="liquor-card" data-id="${escHtml(d.id)}" style="animation-delay:${Math.min(i * 50, 300)}ms" tabindex="0" ondblclick="event.stopPropagation();toggleFav('${d.id}')">
          <div class="liquor-card-image">

            <h3 class="liquor-card-name">${nameHtml}</h3>
            <p class="liquor-card-name-en">${escHtml(d.ename || '')}</p>
            ${descHtml ? `<p class="liquor-card-desc">${descHtml}...</p>` : ''}
            <div class="liquor-card-tags">${tags}</div>

              <div class="liquor-card-abv">酒精度 <strong>${d.abv || 0}%</strong></div>
              <div class="liquor-card-price">¥${priceDisplay}<span class="liquor-card-price-unit"></span></div>
              <div class="liquor-card-actions">
                <button onclick="event.stopPropagation(); toggleFav('${d.id}')" title="${isFav ? '取消收藏' : '收藏'}">${isFav ? '❤️' : '🤍'}</button>
                <button onclick="event.stopPropagation(); addToCompare('${d.id}')" title="比较">⚖️</button>
              </div>

      }).join('');

      grid.querySelectorAll('.liquor-card').forEach(card => {
        card.addEventListener('click', () => openM(card.dataset.id));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') openM(card.dataset.id);

      const stars = document.querySelectorAll('.modal__stars span:first-child ~ span:not([onclick])');

        sp.classList.toggle('active', i < n);

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modalBackdrop').classList.remove('active');
      document.body.style.overflow = '';

    // ── 收藏 ──
    function toggleFav(id) {
      if (favorites[id]) {
        delete favorites[id];
      } else {
        favorites[id] = { date: new Date().toISOString() };
      }
      saveFavorites();
      render();
      showToast(favorites[id] ? '已添加到收藏' : '已取消收藏');
    }

    function updateFavoritesBadge() {
      const btn = document.getElementById('favBtn');
      const count = Object.keys(favorites).length;
      if (count > 0) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    // ── 笔记 ──
    function saveTastingNote(id) {
      const stars = document.querySelectorAll('.modal__stars span[onclick]');
      const activeCount = [...stars].filter(s => s.classList.contains('active')).length;
      const textArea = document.getElementById('tastingNoteText');
      const text = textArea ? textArea.value.trim() : '';

      if (!activeCount && !text) {
        delete TASTING_NOTES[id];
      } else {
        TASTING_NOTES[id] = { rating: activeCount, text, date: new Date().toISOString() };
      }
      saveTastingNotes();
      renderNotesList();
      showToast('笔记已保存');
    }

    function renderNotesList() {
      const list = document.getElementById('notesList');
      if (!list) return;

      const notes = Object.entries(TASTING_NOTES);
      if (!notes.length) {
        list.innerHTML = '<div class="sidebar-empty"><div class="sidebar-empty__icon">📝</div><div class="sidebar-empty__text">暂无品酒笔记</div></div>';
        return;
      }

      list.innerHTML = notes.map(([id, note]) => {
        const d = DATA.find(x => x.id === id);
        if (!d) return '';
        const stars = '★'.repeat(note.rating || 0) + '☆'.repeat(5 - (note.rating || 0));
        const date = new Date(note.date).toLocaleDateString('zh-CN');
        return `<div class="notes-item" data-id="${escHtml(id)}">
          <div class="notes-item-header">
            <span class="notes-item-name">${escHtml(d.name)}</span>
            <span class="notes-item-rating">${stars}</span>
          </div>
          ${note.text ? `<div class="notes-item-text">${escHtml(note.text)}</div>` : ''}
          <div class="notes-item-date">${date}</div>
        </div>`;
      }).join('');

      list.querySelectorAll('.notes-item').forEach(item => {
        item.addEventListener('click', () => {
          openM(item.dataset.id);
          closeSidebar();
        });
      });
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      if (sidebar.classList.contains('active')) {
        renderNotesList();
      }
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    function importNotes() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (typeof data === 'object') {
            TASTING_NOTES = { ...TASTING_NOTES, ...data };
            saveTastingNotes();
            renderNotesList();
            showToast('导入成功');
          }
        } catch (err) {
          showToast('导入失败');
        }
      };
      input.click();
    }

    function exportNotes() {
      const blob = new Blob([JSON.stringify(TASTING_NOTES, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'liquor_tasting_notes.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('导出成功');
    }

    // ── 比较 ──
    function addToCompare(id) {
      if (COMPARE_LIST.includes(id)) {
        COMPARE_LIST = COMPARE_LIST.filter(x => x !== id);
      } else if (COMPARE_LIST.length < 4) {
        COMPARE_LIST.push(id);
      } else {
        showToast('最多比较4款');
        return;
      }
      updateCompareBar();
      render();
    }

    function updateCompareBar() {
      const bar = document.getElementById('compareBar');
      const countEl = document.getElementById('compareCount');
      const itemsEl = document.getElementById('compareItems');
      const openBtn = document.getElementById('compareOpenBtn');

      if (COMPARE_LIST.length > 0) {
        bar.classList.add('active');
        openBtn.style.display = 'flex';
        countEl.textContent = COMPARE_LIST.length;
        itemsEl.innerHTML = COMPARE_LIST.map(id => {
          const d = DATA.find(x => x.id === id);
          if (!d) return '';
          return `<div class="compare-item">
            <span>${escHtml(d.name)}</span>
            <span class="compare-item__remove" onclick="event.stopPropagation(); removeFromCompare('${id}')">✕</span>
          </div>`;
        }).join('');
      } else {
        bar.classList.remove('active');
        openBtn.style.display = 'none';
      }
    }

    function removeFromCompare(id) {
      COMPARE_LIST = COMPARE_LIST.filter(x => x !== id);
      updateCompareBar();
      render();
    }

    function openCompare() {
      if (COMPARE_LIST.length >= 2) {
        showCompareModal();
      }
    }

    function showCompareModal() {
      const overlay = document.getElementById('compareModalOverlay');
      const body = document.getElementById('compareModalBody');
      
      const items = COMPARE_LIST.map(id => DATA.find(x => x.id === id)).filter(Boolean);

      const fields = [
        { key: 'type', label: '类型' },
        { key: 'abv', label: '酒精度' },
        { key: 'origin', label: '产地' },
        { key: 'factory', label: '酒厂' },
        { key: 'price', label: '价格', format: v => '¥' + formatPrice(v) },
        { key: 'aging', label: '年份' },
        { key: 'score', label: '评分' },
        { key: 'aroma', label: '香气' },
        { key: 'taste', label: '口感' },
        { key: 'description', label: '描述' },
        { key: 'tasting', label: '品鉴', format: v => Array.isArray(v) ? v.join(' / ') : v },
        { key: 'pairing', label: '配餐', format: v => Array.isArray(v) ? v.join(', ') : v }
      ];

      body.innerHTML = `
        <table class="compare-table">
          <thead>
            <tr>
              <th>属性</th>
              ${items.map(d => `<th>${escHtml(d.name)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${fields.map(f => `
              <tr>
                <th>${f.label}</th>
                ${items.map(d => {
                  let val = d[f.key];
                  if (f.format) val = f.format(val);
                  return `<td>${escHtml(val || '-')}</td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      overlay.classList.add('active');
    }

    function closeCompareModal() {
      document.getElementById('compareModalOverlay').classList.remove('active');
    }

    // ── Toast ──
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ── 键盘导航 ──
    function setupKeyboardNav() {
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
          closeCompareModal();
          closeSidebar();
        }
      });

      document.getElementById('modalBackdrop').addEventListener('click', closeModal);
    }

    // ── 价格快捷筛选 ──
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('price-chip')) {
        applyQuickPriceFilter(e.target.dataset.quickPrice);
      }
    });

    // ── 初始化 ──
    loadData();
  </script>
</body>
</html>
